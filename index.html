<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8C3B1C">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
<title>Reservas Nuncio Viejo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Reservas">
<style>

:root{
  --bg:#F5F1EB; --card:#FFFFFF; --ink:#1F1A16; --muted:#6E655C; --line:#E6DFD6;
  --accent:#8C3B1C; --accent-ink:#FFFFFF; --accent-soft:#F6E7DE;
  --ok:#1A7F4B; --warn:#92400E; --warn-bg:#FEF3C7; --bad:#B42318; --bad-bg:#FEE4E2;
  --shadow:0 1px 2px rgba(31,26,22,.06),0 4px 14px rgba(31,26,22,.06);
  --weekend:#FBF8F4; --today:#8C3B1C; --pill-ink:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141210; --card:#1E1B18; --ink:#F2EDE7; --muted:#A99F94; --line:#332E29;
    --accent:#E58A5F; --accent-ink:#1B0F08; --accent-soft:#3A2419;
    --ok:#4ADE80; --warn:#FBBF24; --warn-bg:#33270D; --bad:#F87171; --bad-bg:#3A1714;
    --shadow:none; --weekend:#191714; --today:#E58A5F; --pill-ink:#0E0C0A;
  }
}
.p-Booking{--pc:#003B95;--pc-soft:#E7EEF9}
.p-Airbnb{--pc:#E31C5F;--pc-soft:#FDE9F0}
.p-Vrbo{--pc:#6D3FC0;--pc-soft:#F0EAFA}
.p-Directa{--pc:#1A7F4B;--pc-soft:#E5F4EC}
.p-Bloqueo{--pc:#6B7280;--pc-soft:#EEF0F2}
.p-Otra{--pc:#8A6D3B;--pc-soft:#F5EEE2}
@media (prefers-color-scheme: dark){
  .p-Booking{--pc:#6E9BF0;--pc-soft:#17223A}
  .p-Airbnb{--pc:#FF6B8E;--pc-soft:#3A1622}
  .p-Vrbo{--pc:#A98AF2;--pc-soft:#261C3B}
  .p-Directa{--pc:#4CC98A;--pc-soft:#132B1F}
  .p-Bloqueo{--pc:#A1A7B3;--pc-soft:#24262B}
  .p-Otra{--pc:#D3B07A;--pc-soft:#2E261A}
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body.bloq{overflow:hidden}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.app{max-width:640px;margin:0 auto;padding:0 16px calc(110px + env(safe-area-inset-bottom))}

/* Cabecera */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0 10px;display:flex;align-items:center;gap:12px}
.top h1{margin:0;font-size:24px;letter-spacing:-.01em}
.top .sub{margin:2px 0 0;color:var(--muted);font-size:14px}
.top .tit{flex:1;min-width:0}
.icon-btn{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:24px;height:24px;stroke:var(--ink)}
.girando svg{animation:gira 1s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

/* Avisos */
.aviso{border-radius:14px;padding:12px 14px;margin:0 0 10px;font-size:15px;line-height:1.4;background:var(--warn-bg);color:var(--ink);border-left:5px solid var(--warn)}
.aviso.mal{background:var(--bad-bg);border-left-color:var(--bad)}
.aviso b{display:block;margin-bottom:2px}

/* Pestañas y filtros */
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin:4px 0 12px}
.tabs button{border:0;background:transparent;border-radius:10px;padding:11px 8px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;font-size:15px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Lista */
.grupo{margin:18px 0 8px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--pc);border-radius:16px;padding:12px 14px;margin:0 0 10px;box-shadow:var(--shadow);cursor:pointer}
.card.choque{outline:2px solid var(--bad);outline-offset:-1px}
.dia.conflicto .num{background:var(--bad);color:#fff}
.dia.conflicto{box-shadow:inset 0 -3px 0 var(--bad)}
.card-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;background:var(--pc);color:var(--pill-ink);font-size:13px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.01em}
.apt{font-weight:700;font-size:16px}
.tag{margin-left:auto;font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 9px;border-radius:999px}
.tag.nueva{color:var(--ok);background:transparent;border:1px solid currentColor}
.tags{display:flex;gap:6px;margin-left:auto;flex:none}
.tags .tag{margin-left:0;white-space:nowrap}
/* Tarjetas: todo en la primera línea; en pantallas estrechas, letra algo menor y el nombre se recorta si no cabe */
.card .card-top{flex-wrap:nowrap}
.card .card-top .pill{flex:none;white-space:nowrap}
.card .card-top .apt{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){
  .card{padding:12px 12px;border-left-width:5px}
  .card .card-top{gap:6px}
  .card .card-top .pill{font-size:12px;padding:2px 7px}
  .card .card-top .apt{font-size:15px}
  .tags{gap:4px}
  .tags .tag{font-size:12px;padding:2px 7px}
}
.fechas{font-size:19px;font-weight:650;margin:8px 0 2px}
.fechas .n{font-weight:400;color:var(--muted);font-size:16px}
.quien{font-size:15px;color:var(--ink)}
.quien.vacio{color:var(--muted)}
.nota{font-size:14px;color:var(--muted);margin-top:4px;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.alerta-txt{font-size:14px;color:var(--warn);font-weight:600;margin-top:4px}
.vacio-lista{text-align:center;color:var(--muted);padding:48px 12px}
.vacio-lista b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}

/* Calendario */
.mes{display:flex;align-items:center;justify-content:space-between;margin:2px 0 8px}
.mes h2{margin:0;font-size:20px;text-transform:capitalize}
.mes .icon-btn{width:44px;height:44px}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted);margin:0 0 10px}
.leyenda span{display:inline-flex;align-items:center;gap:5px}
.leyenda i{width:12px;height:12px;border-radius:3px;background:var(--pc);display:inline-block}
.carriles{font-size:13px;color:var(--muted);margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.dsem{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding:8px 0;border-bottom:1px solid var(--line)}
.dia{border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;min-height:62px;padding:5px 0 6px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left}
.dia:nth-child(7n){border-right:0}
.dia.finde{background:var(--weekend)}
.dia.fuera{opacity:.38}
.dia .num{font-size:14px;font-weight:600;padding:0 6px;line-height:22px;height:22px;display:inline-block;align-self:flex-start;margin-left:3px;border-radius:999px;min-width:22px;text-align:center}
.dia.hoy .num{background:var(--today);color:var(--accent-ink)}
.dia.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.carril{height:10px;position:relative}
.barra{position:absolute;inset:0 -1px 0 0;background:var(--pc)}
.barra.ini{left:5px;border-radius:5px 0 0 5px}
.barra.fin{right:5px;border-radius:0 5px 5px 0}
.barra.ini.fin{border-radius:5px}
.detalle{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:12px}
.detalle h3{margin:0 0 8px;font-size:17px}
.dfila{padding:10px 0;border-top:1px solid var(--line)}
.dfila:first-of-type{border-top:0}
.dapt{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.libre{color:var(--ok);font-weight:600}
.mini{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--pc-soft);border:0;border-radius:12px;padding:9px 10px;margin:4px 0 0;cursor:pointer}
.mini .q{flex:1;min-width:0;font-size:15px}
.mini .q small{display:block;color:var(--muted);font-size:13px}

/* Botón añadir */
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(18px + env(safe-area-inset-bottom));z-index:6;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;padding:16px 22px;border-radius:999px;box-shadow:0 6px 18px rgba(140,59,28,.35);cursor:pointer;display:flex;align-items:center;gap:8px}
.fab span{font-size:24px;line-height:16px}

/* Hoja inferior */
.velo{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.velo[hidden]{display:none}
.hoja{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));animation:sube .18s ease-out}
@keyframes sube{from{transform:translateY(30px);opacity:.6}}
.asa{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.hoja-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.hoja-top .apt{flex:1}
.hoja h2{margin:0 0 4px;font-size:21px}
.hint{color:var(--muted);font-size:14px;margin:6px 0}
label.campo{display:block;margin:12px 0 0;font-size:14px;font-weight:600;color:var(--muted)}
.campo input,.campo textarea,.campo select{display:block;width:100%;margin-top:5px;font:inherit;font-size:17px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.campo textarea{resize:vertical;min-height:84px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.seg button{flex:1 1 40%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 8px;font-weight:600;cursor:pointer;font-size:15px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.acciones{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:15px 12px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;color:var(--ink);font-size:16px}
.btn.prim{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.peligro{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.55}
.enlaces{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.enlaces .btn{flex:1 1 30%;padding:11px 8px;font-size:15px}
.msg{margin-top:12px}
.noches-txt{font-size:14px;color:var(--muted);margin-top:6px}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:15px;max-width:calc(100% - 32px);width:max-content;transition:.2s;z-index:30}
.toast.ver{opacity:1;transform:translateX(-50%)}
.cargando{padding:60px 0;text-align:center;color:var(--muted)}

/* PWA */
.top{padding-top:calc(14px + env(safe-area-inset-top))}
.instalar{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border-radius:14px;padding:12px 14px;margin:0 0 10px}
.instalar p{margin:0;flex:1;font-size:15px}
.instalar .btn{flex:none;padding:10px 14px}
.offline{font-size:13px;color:var(--warn);font-weight:600}
.dato{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:16px}
.dato:first-of-type{border-top:0}
.dato span{color:var(--muted);min-width:96px}
.bienvenida{padding:64px 8px;text-align:center}
.bienvenida h2{margin:0 0 8px}
.bienvenida p{color:var(--muted);margin:0 auto;max-width:420px}

.login{max-width:420px;margin:0 auto;padding:40px 0}
.login h2{font-size:24px;margin:0 0 6px}
.login p{color:var(--muted);margin:0 0 14px}
.login .campo input{font-size:20px;letter-spacing:.02em}
.login .codigo{font-size:28px !important;letter-spacing:.4em;text-align:center}
.cal-fila{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--pc);border-radius:14px;padding:10px 12px;margin:10px 0}
.cal-fila .tit{display:flex;gap:8px;align-items:center;font-weight:700;font-size:15px}
.cal-fila input{display:block;width:100%;margin-top:8px;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.cal-fila .est{font-size:13px;color:var(--muted);margin-top:6px}
.cal-fila .est.ok{color:var(--ok)} .cal-fila .est.mal{color:var(--bad)}
.menu-lista{display:flex;flex-direction:column;gap:10px;margin-top:10px}
@media (max-width:400px){.tabs button{font-size:15px;padding:11px 4px}}
.btn.grabando{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.ocup{margin:0 0 12px}
.ocup-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ocup-top h3{margin:0}
.pct{font-size:28px;font-weight:800;color:var(--accent)}
.barra-ocup{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line);margin:0 0 6px}
.barra-ocup i{display:block;height:100%;background:var(--pc)}
.punto{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--pc);margin-right:6px}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="cabecera" hidden>
    <div class="tit"><h1>Reservas</h1><p class="sub" id="sub">Cargando…</p></div>
    <button class="icon-btn" id="btnSync" aria-label="Comprobar ahora las plataformas" title="Comprobar ahora">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.9-3.9M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.9 3.9M20 20v-4h-4"/></svg>
    </button>
    <button class="icon-btn" id="btnMenu" aria-label="Menú" title="Menú">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </header>
  <div id="instalar"></div>
  <div id="avisos"></div>
  <nav class="tabs" role="tablist" id="pestanas" hidden>
    <button data-tab="proximas" class="on" role="tab">Próximas</button>
    <button data-tab="calendario" role="tab">Calendario</button>
    <button data-tab="ocupacion" role="tab">Ocupación</button>
  </nav>
  <div class="chips" id="chips"></div>
  <main id="vista"><div class="cargando">Cargando…</div></main>
</div>
<div class="velo" id="velo" hidden><div class="hoja" id="hoja" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script src="app.js?v=16"></script>
</body>
</html>
